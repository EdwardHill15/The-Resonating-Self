# Netlify publiceert de map die Quarto lokaal heeft gerenderd.
# Er is geen buildstap op de server: 'quarto render' draait op je eigen machine.

[build]
  publish = "_site"
  command = ""
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Geen catch-all redirect: Netlify serveert 404.html automatisch wanneer een
# pad niet bestaat. Een regel 'from = "/*"' kan bestaande pagina's afvangen.

# De suite in een eigen tabblad
[[redirects]]
  from = "/suite/app"
  to = "/app/index.html"
  status = 301

[[headers]]
  for = "/app/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
