# Netlify publiceert de map die Quarto lokaal heeft gerenderd.
# Er is geen buildstap op de server: 'quarto render' draait op je eigen machine.

[build]
  publish = "_site"
  command = ""
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# De MMPI-2 Casusanalyse-app zelf staat NIET in _site (dus nooit als los,
# publiek bestand bereikbaar). included_files bundelt het wachtwoord-
# beveiligd bij deze functie; zie netlify/functions/psychodiag-app.mjs en
# README.md ("Psychodiagnostiek (afgeschermd)").
[functions."psychodiag-app"]
  included_files = ["netlify/protected/psychodiagnostiek.html"]

# Geen catch-all redirect: Netlify serveert 404.html automatisch wanneer een
# pad niet bestaat. Een regel 'from = "/*"' kan bestaande pagina's afvangen.

# De suite in een eigen tabblad
[[redirects]]
  from = "/suite/app"
  to = "/app/index.html"
  status = 301

# Psychodiagnostiek: elk verzoek onder dit pad gaat naar de beveiligde functie
# in plaats van naar een los bestand. De iframe op psychodiagnostiek.qmd wijst
# hiernaar; zonder geldig sessiecookie levert de functie alleen een inlogscherm.
[[redirects]]
  from = "/app/psychodiagnostiek"
  to = "/.netlify/functions/psychodiag-app"
  status = 200
  force = true

[[redirects]]
  from = "/app/psychodiagnostiek/*"
  to = "/.netlify/functions/psychodiag-app"
  status = 200
  force = true

# Elke pagina ook bereikbaar met een afsluitende schuine streep.
# status 200 = rewrite: de URL in de adresbalk blijft staan.
[[redirects]]
  from = "/:page/"
  to = "/:page.html"
  status = 200

[[redirects]]
  from = "/en/:page/"
  to = "/en/:page.html"
  status = 200

[[headers]]
  for = "/app/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
